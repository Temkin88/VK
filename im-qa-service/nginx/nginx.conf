user       root;  ## Default: nobody
worker_processes  5;  ## Default: 1
worker_rlimit_nofile 8192;


events {
  worker_connections  4096;  ## Default: 1024
}

http {

  default_type application/octet-stream;
  include       /etc/nginx/mime.types;
  sendfile     on;
  tcp_nopush   on;
  server_names_hash_bucket_size 128; # this seems to be required for some vhosts

  server { # simple reverse-proxy
    listen       8080;
    listen       8443 ssl;
    server_name 100.99.4.234;
    ssl_certificate     /usr/local/openresty/nginx/nginx_certs/ip/im-qa-helper.mail.msk.crt;
    ssl_certificate_key /usr/local/openresty/nginx/nginx_certs/ip/im-qa-helper.mail.msk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security 'max-age=604800';

    error_page 504 /504.json;

    # pass requests for dynamic content to rails/turbogears/zope, et al
    location /504.json {
        proxy_hide_header Content-Type;
        add_header Content-Type application/json;
        return 504 '{"success": false, "error": "RequestException: GatewayTimeout on im-helper proxy"}';
    }
    location ~ ^/api/v1/websocket/ws/[0-9a-z]+$ {
        deny 100.99.18.12;
        proxy_pass http://web:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location / {
      deny 100.99.18.12;

      proxy_pass      http://web:8000;

      proxy_connect_timeout       600;
      proxy_send_timeout          6000;
      proxy_read_timeout          60000;
      send_timeout                600;
    }
  }

  server { # simple reverse-proxy
    listen       8080;
    listen       8443 ssl;
    server_name im-qa-helper.mail.msk;
    ssl_certificate     /usr/local/openresty/nginx/nginx_certs/domain/im-qa-helper.mail.msk.crt;
    ssl_certificate_key /usr/local/openresty/nginx/nginx_certs/domain/im-qa-helper.mail.msk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security 'max-age=604800';

    error_page 504 /504.json;

    # pass requests for dynamic content to rails/turbogears/zope, et al
    location /504.json {
        proxy_hide_header Content-Type;
        add_header Content-Type application/json;
        return 504 '{"success": false, "error": "RequestException: GatewayTimeout on im-helper proxy"}';
    }
    location ~ ^/api/v1/websocket/ws/[0-9a-z]+$ {
        deny 100.99.18.12;
        proxy_pass http://web:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location / {
      deny 100.99.18.12;

      proxy_pass      http://web:8000;

      proxy_connect_timeout       600;
      proxy_send_timeout          6000;
      proxy_read_timeout          60000;
      send_timeout                600;
    }
  }
}