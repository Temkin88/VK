<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Reader</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <link rel="icon" href="../favicon.png" type="image/png">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        #formContainer {
            text-align: center;
            margin: 20px;
        }

        #loading {
            display: none;
            text-align: center;
            font-size: 20px;
            color: #555;
        }

        .spinner {
            margin: 20px auto;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 5px solid #ccc;
            border-top-color: #555;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #filters {
            display: none; /* Изначально скрыт */
            justify-content: center;
            margin-bottom: 10px;
        }

        #fileName {
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #logTable {
            width: 100%;
            height: 100%;
            margin: 0 auto;
            display: none;
            table-layout: fixed; /* Фиксированная ширина столбцов */
        }

        #logTable th, #logTable td {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #logTable td.message {
            cursor: pointer;
        }

        #logTable td.message.expanded {
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            cursor: text; /* Изменяем курсор на текст для выделения */
        }
    </style>
</head>
<body>
    <div id="formContainer">
        <h1>Upload Log File</h1>
        <form id="uploadForm" action="/" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <input type="submit" value="Upload">
            <label for="log_type">Тип лога:</label>
<!--            <div>-->
<!--                <label>Тип лога:</label><br>-->
<!--                <input type="radio" id="desktop" name="log_type" value="desktop" checked>-->
<!--                <label for="desktop">Desktop</label><br>-->
<!--                <input type="radio" id="ios" name="log_type" value="ios">-->
<!--                <label for="ios">iOS</label><br>-->
<!--                <input type="radio" id="android" name="log_type" value="android">-->
<!--                <label for="android">Android</label>-->
<!--            </div>-->
            <select id="log_type" name="log_type" required>
                <option value="" disabled selected> </option>
                <option value="desktop">Desktop</option>
                <option value="ios">iOS</option>
                <option value="android">Android</option>
            </select>
        </form>
    </div>
    <div id="loading">
        <div class="spinner"></div>
        Loading...
    </div>
    <div id="fileName"></div>
    <div id="filters">
        <div>
            <label for="lineStart">Line Number Start:</label>
            <input type="number" id="lineStart" min="1">
            <label for="lineEnd">End:</label>
            <input type="number" id="lineEnd" min="1">
        </div>
        <div style="margin-left: 20px;">
            <label for="timeStart">Time Start:</label>
            <input type="time" id="timeStart" step="1">
            <label for="timeEnd">End:</label>
            <input type="time" id="timeEnd" step="1">
        </div>
        <button id="applyFilters" style="margin-left: 20px;">Apply Filters</button>
    </div>
    <table id="logTable" class="display">
        <thead>
            <tr>
                <th>Line Number</th>
                <th>Time</th>
                <th>Level</th>
                <th>Source</th>
                <th>Message</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script>
        let dataTable;

        document.getElementById('uploadForm').onsubmit = function(event) {
            event.preventDefault(); // Предотвращаем стандартное поведение формы
            document.getElementById('loading').style.display = 'block';
            document.getElementById('formContainer').style.display = 'none';

            const fileInput = document.querySelector('input[type="file"]');
            const selectedType = document.getElementById('log_type').value;
            const fileName = fileInput.files[0].name;
            document.getElementById('fileName').textContent = `File: ${fileName}`;

            const formData = new FormData(document.getElementById('uploadForm'));
            fetch('/', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                const tableBody = $('#logTable tbody');
                tableBody.empty(); // Очищаем таблицу перед добавлением новых данных

                data.forEach(log => {
                    const row = $('<tr>');
                    row.append($('<td>').text(log.line_number || ''));
                    row.append($('<td>').text(log.time || ''));
                    row.append($('<td>').text(log.level || ''));
                    row.append($('<td>').text(log.source || ''));
                    const messageCell = $('<td class="message">').text(log.message || log.unparsed || '');
                    messageCell.one('click', function() {
                        $(this).addClass('expanded');
                    });
                    row.append(messageCell);
                    tableBody.append(row);
                });

                if (dataTable) {
                    dataTable.destroy();
                }

                dataTable = $('#logTable').DataTable({
                    "autoWidth": false, // Отключаем автоматическую ширину
                    "scrollY": "50vh", // Высота таблицы с вертикальной прокруткой
                    "scrollCollapse": true,
                    "paging": true,
                    "pageLength": 1000, // Количество строк на странице
                    "columnDefs": [
                        { "width": "3%", "targets": 0 }, // Ширина для номера строки
                        { "width": "5%", "targets": 1 }, // Ширина для времени
                        { "width": "4%", "targets": 2 }, // Ширина для времени
                        { "width": "10%", "targets": 3 }, // Ширина для источника
                        { "width": "70%", "targets": 4 } // Ширина для сообщения
                    ]
                });
                $('#logTable').show();
                $('#filters').show(); // Показываем фильтры вместе с таблицей
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('formContainer').style.display = 'block';
            });
        };

        document.getElementById('applyFilters').onclick = function() {
            const lineStart = parseInt(document.getElementById('lineStart').value, 10) || 0;
            const lineEnd = parseInt(document.getElementById('lineEnd').value, 10) || Infinity;
            const timeStart = document.getElementById('timeStart').value || '00:00:00';
            const timeEnd = document.getElementById('timeEnd').value || '23:59:59';

            $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
                const lineNumber = parseInt(data[0], 10) || 0;
                const time = (data[1] || '00:00:00').substring(0, 8); // Убираем миллисекунды

                return (lineNumber >= lineStart && lineNumber <= lineEnd) &&
                       (time >= timeStart && time <= timeEnd);
            });

            dataTable.draw();
            $.fn.dataTable.ext.search.pop();
        };
    </script>
</body>
</html>
