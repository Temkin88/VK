jira:
  oauth:
    access_token: access_token
    access_token_secret: access_token_secret
    consumer_key: consumer_key
    key_cert: cert
  server: https://jira.vk.team
jira.settings:
  project: 'IMQA'
  issuetype: 'Задача'
  priority:
    name: 'Стандартный'
jira.settings.extra:
  test_cases:
    customfield_15500: 'IMQA-3877'
    labels:
      - Garbage_Collector
      - Quality_Backlog
  defects:
    customfield_15500: 'IMQA-4075'
    labels:
      - Garbage_Collector
loguru.std:
  level: 'DEBUG'
  format: '<green>{time:YYYY-MM-DD HH:mm:ss}</green> | {level} | {name}:{function}:{line} | project={extra[project_id]} | case_id={extra[test_case_id]} | defect_id={extra[defect_id]} | <level>{message}</level>'
  colorize: true
loguru.file:
  level: 'DEBUG'
  sink: 'logs/garbage_collector_{time}.log'
  format: '<green>{time:YYYY-MM-DD HH:mm:ss}</green> | {level} | {name}:{function}:{line} | project={extra[project_id]} | case_id={extra[test_case_id]} | defect_id={extra[defect_id]} | <level>{message}</level>'
  rotation: '00:00'
  retention: '30 days'
  compression: 'zip'
  colorize: true
  backtrace: true
  diagnose: true
  delay: true
  watch: true
loguru.extra:
  project_id: 'NONE'
  test_case_id: 'NONE'
  defect_id: 'NONE'
allure:
  token: 'Api-Token XXXXXXXXX'
allure.template.links:
  defect: 'https://allure.vk.team/project/{project_id}/defects/{defect_id}'
  test_case: 'https://allure.vk.team/project/{project_id}/test-cases/{test_case_id}'
allure.extra:
  page_size: 100
  forgotten_after_period: 5356800
  ignore_statuses:
    - Draft
  ignore_issues_count: false
  custom_fields_to_check:
    - Suite
    - Product
    - Product Functionality
#    - Feature
#    - Severity
notify:
  chat_id: 'AoGOt2jGhHEYLh9SGg'
#  chat_id: 'AoGFggh_tm5hdvdPYw'
vk_team_bot:
  api_url_base: https://api.internal.myteam.mail.ru/bot/v1
  token: XXXXXXXXXXXXX
  is_myteam: true
  poll_time_s: 30
  timeout_s: 60
  version: 1.0.0
  name: 'IMGarbageCollectorBot'
