repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.4.4
  hooks:
    # Run the linter.
    - id: ruff
      types:
        - python
    # Run the formatter.
    - id: ruff-format
      types:
        - python
- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.29.0
  hooks:
    - id: yamllint
      args: [--strict, -c=./config.example.yaml]
