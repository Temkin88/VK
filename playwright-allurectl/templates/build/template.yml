spec:
  inputs:
    FROM_VERSION_TAG:
      type: string
      options: ['20.17-bullseye', '20.17.0-bookworm']
    PW_VERSION:
      type: string
      default: '1.46.1'
    stage:
      default: build
---

"docker:$[[ inputs.stage ]]":
  image: mirror.gcr.io/docker:24.0.5-dind
  stage: $[[ inputs.stage ]]
  tags:
    - shared-docker-supply
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    FROM_VERSION_TAG: 20.17-bullseye
    PW_VERSION: v1.46.1
    SELF_IMAGE_NAME: playwright-allurectl
  script:
    - |
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      export DOCKER_TAG=$(date +"%Y%m%d.%H%M")-${CI_COMMIT_SHORT_SHA}
      export DOCKER_IMAGE_NAME=${CI_REGISTRY}/${CI_PROJECT_PATH}/${SELF_IMAGE_NAME}
      docker pull mcr.microsoft.com/playwright:v1.41.0-focal
      docker build . -f Dockerfile \
        --build-arg PW_VERSION=v$[[ inputs.PW_VERSION ]] \
        --build-arg FROM_VERSION_TAG=$[[ inputs.FROM_VERSION_TAG ]] \
        -t ${DOCKER_IMAGE_NAME}:${DOCKER_TAG}-${FROM_VERSION_TAG} \
        -t ${DOCKER_IMAGE_NAME}:stable-${FROM_VERSION_TAG} \
        -t ${DOCKER_IMAGE_NAME}:$(date +"%y.%-m")-${FROM_VERSION_TAG} \
        --no-cache
      docker push ${DOCKER_IMAGE_NAME}:stable-${FROM_VERSION_TAG}
      docker push ${DOCKER_IMAGE_NAME}:${DOCKER_TAG}-${FROM_VERSION_TAG}
      docker push ${DOCKER_IMAGE_NAME}:$(date +"%y.%-m")-${FROM_VERSION_TAG}
