[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "im_swagger_spy/__init__.py"


[project]
name = "im-swagger-spy"
description = "im-swagger-spy: pytest plugin for matching methods in swagger with those used in tests"
readme = "README.md"
dynamic = ["version"]
authors = [
    { name = "Korobov Valerii", email = "v.korobov@corp.mail.ru" },
]

keywords = ["swagger", "pytest", "pytest plugin", "plugin", "requests"]

requires-python = ">=3.8"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: Pytest"
]

dependencies = [
    "filelock>=3.0.0",
    "Jinja2>=3.0.0",
    "peewee>=3.0.0",
    "pytest>=7.0.0",
    "PyYAML>=6.0",
    "requests>=2.26.0",
    "prometheus_client>=0.20.0",
    "click>=8.0.0",
    "markdown-it-py>=3.0.0",
    "mdurl>=0.1.0",
    "pygments>=2.19.0",
    "rich>=10.11.0",
    "shellingham>=1.5.4",
    "typer>=0.12.5",
    "typing-extensions>=3.7.4.3"
]

[project.entry-points.pytest11]
myproject = "im_swagger_spy.plugin"

[project.optional-dependencies]
linter = [
    "ruff>=0.6.4"
]
tests = [
    "pytest-cov>=6.0.0",
    "coverage>=7.0.0"
]

[project.urls]
Homepage = "https://lancetnik.github.io/Propan/"
Documentation = "https://lancetnik.github.io/Propan/"
Tracker = "https://github.com/Lancetnik/Propan/issues"
Source = "https://github.com/Lancetnik/Propan"

[project.scripts]
im_swagger_spy = "im_swagger_spy.__main__:cli"

[tool.hatch.metadata]
allow-direct-references = true
allow-ambiguous-features = true

[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
    "/tests",
    "/openapi_example",
]

[tool.hatch.envs.default]
python = "3.11"
skip-install = false
features = [
  "dev",
]

[[tool.hatch.envs.test.matrix]]
python = ["37", "38", "39", "310", "311", "312"]

[tool.hatch.envs.test.scripts]
run = "pytest"

[tool.hatch.envs.test-last.scripts]
run = "pytest"

[tool.ruff]
fix = true
line-length = 88
target-version = "py311"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "Q",  # flake8-quotes
]
ignore = ["C901"]
convention = "google"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-vv --cov=im_swagger_spy --cov-report=term-missing:skip-covered -p ./im_swagger_spy"
testpaths = "/tests"

log_cli = true
log_cli_level = "INFO"
# https://docs.python.org/3/library/logging.html#module-logging
log_cli_format = "[%(asctime)s] [%(levelname)s] [%(name)s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%H:%M:%S"

[tool.coverage.run]
parallel = true
branch = true
concurrency = [
    "multiprocessing",
    "thread"
]
source = [
    "im_swagger_spy",
    "tests"
]
context = '${CONTEXT}'
omit = [
    "**/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    ".*# pragma: no cover",
    "if __name__ == .__main__.:",
    "self.logger",
    "def __repr__",
    "lambda: None",
    "from .*",
    "import .*",
    '@(abc\.)?abstractmethod',
    "raise NotImplementedError",
    'raise AssertionError',
    'raise ValueError',
    'logger\..*',
    "pass",
    '\.\.\.',
]
omit = [
    '*/__about__.py',
    '*/__main__.py',
    '*/__init__.py',
    '*/annotations.py',
]