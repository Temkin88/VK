[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-build-scripts"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pyvkteamsipros/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pyvkteamsipros"]
artifacts = [
  "*.so",
  "*.dll",
  "!/foo/*.so",
]

[[tool.hatch.build.hooks.build-scripts.scripts]]
commands = [
    "cd pyvkteamsipros/icrc32 && make"
]
artifacts = []

[project]
name = "pyvkteamsipros"
dynamic = ["version"]
dependencies = [

]
requires-python = ">=3.9"
authors = [
  {name = "Valerii Korobov", email = "v.korobov@corp.mail.ru"},
]
maintainers = [
  {name = "Valerii Korobov", email = "v.korobov@corp.mail.ru"},
]
description = "IPros client"
readme = "README.md"
license = {text = "MIT License"}
keywords = ["VK Teams", "ICQ", "API", "client"]
classifiers = [
    "Programming Language :: Python",
    "Topic :: Software Development :: Build Tools",

    # Pick your license as you wish (see also "license" above)
    "License :: OSI Approved :: MIT License",

    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://gitlab.corp.mail.ru/imqa/pyvkteamsipros"
Documentation = "https://gitlab.corp.mail.ru/imqa/pyvkteamsipros/-/blob/master/README.md"
Repository = "https://gitlab.corp.mail.ru/imqa/pyvkteamsipros.git"
"Bug Tracker" = "https://gitlab.corp.mail.ru/imqa/pyvkteamsipros/-/issues"
Changelog = "https://gitlab.corp.mail.ru/imqa/pyvkteamsipros/-/commits/master?ref_type=heads"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.8
target-version = "py38"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E", "F", "W", "B", "A",
    "COM", "C4", "ICN", "LOG", "PIE", "T20", "PT", "Q", "RSE", "SLF", "SIM", "TCH", "PTH", "ERA", "RUF",
    "TD", "FIX",
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF012",
    "RUF100",
    "COM812",
    "TCH004"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

